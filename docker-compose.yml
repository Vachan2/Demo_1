version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-demo-pg
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./demo/order-service/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Order Service API
  order-api:
    build:
      context: ./demo/order-service
      dockerfile: Dockerfile
    container_name: sentinel-demo-order-api
    ports:
      - "9000:9000"
    environment:
      DATABASE_URL: postgresql://orders:orders@postgres:5432/orders
      SENTINEL_URL: ${SENTINEL_URL:?Set SENTINEL_URL to the modern Sentinel API}
      DEMO_FAILURE_MODE: none
      SENTINEL_INCIDENT_API_KEY: ${SENTINEL_INCIDENT_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 9000 --reload
    volumes:
      - ./demo/order-service:/app

volumes:
  postgres_data:
