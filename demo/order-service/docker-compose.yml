version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders"]
      interval: 2s
      timeout: 5s
      retries: 10

  order-api:
    build: .
    ports:
      - "9000:9000"
    environment:
      DATABASE_URL: postgresql://orders:orders@postgres:5432/orders
      APP_VERSION: "1.0.0"
      IMAGE_VERSION: ${IMAGE_VERSION:-local}
      DEMO_FAILURE_MODE: ${DEMO_FAILURE_MODE:-none}
      DEMO_FAILURE_ADMIN_TOKEN: ${DEMO_FAILURE_ADMIN_TOKEN:-}
      SENTINEL_URL: ${SENTINEL_URL:?Set SENTINEL_URL to the modern Sentinel API}
      SENTINEL_INCIDENT_API_KEY: ${SENTINEL_INCIDENT_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
